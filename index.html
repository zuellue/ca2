<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CA2</title>
<style>
  @font-face { font-family: 'Ca2-Thin'; src: url('Ca2-Thin.ttf') format('truetype'); font-display: block; }
  :root { --fg: #111; --fg-soft: rgba(17,17,17,.35); --bg: #fff; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
  canvas#c, canvas#g { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; }
  canvas#g { pointer-events: none; }
  /* config: same language as the sketch - Ca2-Thin, hairlines, no boxes */
  #tab { position: fixed; top: 0; right: 0; width: 18px; height: 100%; z-index: 9; }
  #panel { position: fixed; top: 0; right: 0; height: 100%; width: 340px; max-width: 86vw; z-index: 10; box-sizing: border-box;
    padding: 18px 26px 24px 26px; overflow-y: auto; scrollbar-width: none;
    font-family: 'Fragment Mono', ui-monospace, 'SF Mono', Menlo, monospace; font-size: 13px; line-height: 1.3; letter-spacing: .04em; color: var(--fg); background: var(--panel-bg, var(--bg));
    transform: translateX(100%); transition: transform .2s ease-out; will-change: transform; }
  #panel::-webkit-scrollbar { display: none; }
  #tab:hover + #panel, #panel:hover, #panel.open { transform: translateX(0); }
  /* backdrop blur: full at the right edge, fading to sharp leftwards; width is a parameter (blurWidth) */
  #blur { position: fixed; top: 0; right: 0; height: 100%; width: 340px; z-index: 9; pointer-events: none;
    transform: translateX(100%); transition: transform .2s ease-out; will-change: transform; }
  #tab:hover + #panel + #blur, #panel:hover + #blur, #panel.open + #blur { transform: translateX(0); }
  /* depth of field: stacked progressive blur layers, strongest at the screen edge, easing to sharp inward */
  .bf { position: absolute; inset: 0; pointer-events: none; }
  #blur .bf1 { -webkit-backdrop-filter: blur(calc(var(--bmax, 16px) * .25)); backdrop-filter: blur(calc(var(--bmax, 16px) * .25)); -webkit-mask-image: linear-gradient(to left, #000 55%, rgba(0,0,0,0) 100%); mask-image: linear-gradient(to left, #000 55%, rgba(0,0,0,0) 100%); }
  #blur .bf2 { -webkit-backdrop-filter: blur(calc(var(--bmax, 16px) * .5)); backdrop-filter: blur(calc(var(--bmax, 16px) * .5)); -webkit-mask-image: linear-gradient(to left, #000 35%, rgba(0,0,0,0) 75%); mask-image: linear-gradient(to left, #000 35%, rgba(0,0,0,0) 75%); }
  #blur .bf3 { -webkit-backdrop-filter: blur(calc(var(--bmax, 16px) * .75)); backdrop-filter: blur(calc(var(--bmax, 16px) * .75)); -webkit-mask-image: linear-gradient(to left, #000 15%, rgba(0,0,0,0) 50%); mask-image: linear-gradient(to left, #000 15%, rgba(0,0,0,0) 50%); }
  #blur .bf4 { -webkit-backdrop-filter: blur(var(--bmax, 16px)); backdrop-filter: blur(var(--bmax, 16px)); -webkit-mask-image: linear-gradient(to left, #000 0%, rgba(0,0,0,0) 25%); mask-image: linear-gradient(to left, #000 0%, rgba(0,0,0,0) 25%); }
  /* flipped twin on the left while the config is open: a depth-of-field field across the page */
  #blurl { position: fixed; top: 0; left: 0; height: 100%; width: 340px; z-index: 9; pointer-events: none; opacity: 0; transition: opacity .35s ease .1s; }
  #blurl .bf1 { -webkit-backdrop-filter: blur(calc(var(--bmax, 16px) * .25)); backdrop-filter: blur(calc(var(--bmax, 16px) * .25)); -webkit-mask-image: linear-gradient(to right, #000 55%, rgba(0,0,0,0) 100%); mask-image: linear-gradient(to right, #000 55%, rgba(0,0,0,0) 100%); }
  #blurl .bf2 { -webkit-backdrop-filter: blur(calc(var(--bmax, 16px) * .5)); backdrop-filter: blur(calc(var(--bmax, 16px) * .5)); -webkit-mask-image: linear-gradient(to right, #000 35%, rgba(0,0,0,0) 75%); mask-image: linear-gradient(to right, #000 35%, rgba(0,0,0,0) 75%); }
  #blurl .bf3 { -webkit-backdrop-filter: blur(calc(var(--bmax, 16px) * .75)); backdrop-filter: blur(calc(var(--bmax, 16px) * .75)); -webkit-mask-image: linear-gradient(to right, #000 15%, rgba(0,0,0,0) 50%); mask-image: linear-gradient(to right, #000 15%, rgba(0,0,0,0) 50%); }
  #blurl .bf4 { -webkit-backdrop-filter: blur(var(--bmax, 16px)); backdrop-filter: blur(var(--bmax, 16px)); -webkit-mask-image: linear-gradient(to right, #000 0%, rgba(0,0,0,0) 25%); mask-image: linear-gradient(to right, #000 0%, rgba(0,0,0,0) 25%); }
  #tab:hover ~ #blurl, #panel:hover ~ #blurl, #panel.open ~ #blurl { opacity: 1; }

  @keyframes ca2in { from { opacity: 0 } to { opacity: 1 } }
  #panel h1 { margin: 0 0 6px; font-weight: normal; font-size: 13px; letter-spacing: .3em; font-family: 'Times New Roman', Times, serif; }
  .grp, .stats span:not(.n) { font-family: 'Times New Roman', Times, serif; }
  .stats span:not(.n) { text-transform: uppercase; }
  #secc .sl { font-family: 'Times New Roman', Times, serif; }
  .n { font-family: 'Ca2-Thin', monospace; font-size: 54px; white-space: nowrap; line-height: 1; letter-spacing: 0; }
  .stats { display: grid; grid-template-columns: auto 1fr; column-gap: 12px; white-space: nowrap; padding: 8px 0 12px; border-bottom: 1.5px solid var(--fg-soft); margin-bottom: 10px; }
  .stats span:nth-child(even) { text-align: right; }
  .stats span:nth-child(odd) { align-self: center; }
  .grp { margin: 14px 0 2px; letter-spacing: .3em; text-transform: uppercase; font-size: 13px; color: var(--fg-soft); padding-bottom: 3px; }
  .row { padding: 7px 0 4px; }
  .row .lab { display: flex; justify-content: space-between; }
  .row input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; margin: 2px 0 0; background: transparent; cursor: pointer; }
  .row input[type=range]::-webkit-slider-runnable-track { height: 1.5px; background: var(--fg-soft); }
  .row input[type=range]::-moz-range-track { height: 1.5px; background: var(--fg-soft); }
  .row input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; margin-top: -5px; border-radius: 50%; border: 1.5px solid var(--fg-soft); background: transparent; }
  .row input[type=range]::-moz-range-thumb { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--fg-soft); background: transparent; }
  /* knob hover: CA-driven drift of the thumb (visual only; the value does not change) */
  .row input[type=range]::-webkit-slider-thumb { transform: translate(var(--kx, 0px), 0) scale(var(--ks, 1)); transition: transform .1s linear; }
  .row input[type=range]::-moz-range-thumb { transform: translate(var(--kx, 0px), 0) scale(var(--ks, 1)); transition: transform .1s linear; }
  .row input[type=range]:hover::-webkit-slider-thumb { background: var(--hc, transparent); border-color: var(--hc, var(--fg-soft)); }
  .row input[type=range]:hover::-moz-range-thumb { background: var(--hc, transparent); border-color: var(--hc, var(--fg-soft)); }
  .row.live .lab b { color: var(--kc); }
  .row.live input[type=range]::-webkit-slider-thumb { background: var(--kc); border-color: var(--kc); }
  .row.live input[type=range]::-moz-range-thumb { background: var(--kc); border-color: var(--kc); }
  .row.live input[type=range]::-webkit-slider-runnable-track { background: var(--kc); }
  .row.live input[type=range]::-moz-range-track { background: var(--kc); }
  .row .lab b { cursor: text; }
  .row .lab .man { font: inherit; color: inherit; background: transparent; border: 0; border-bottom: 1.5px solid var(--fg); outline: none; width: 72px; text-align: right; padding: 0; caret-color: var(--fg); }
  .chk { display: flex; justify-content: space-between; padding: 7px 0; cursor: pointer; user-select: none; }
  .chk b { font-weight: normal; }
  .btns { display: flex; flex-wrap: wrap; gap: 4px 20px; padding-top: 12px; border-top: 1.5px solid var(--fg-soft); margin-top: 10px; }
  .btns button { font: inherit; color: inherit; background: none; border: 0; padding: 4px 0; cursor: pointer; border-bottom: 1.5px solid transparent; }
  .btns button:hover { border-bottom-color: var(--fg); }
  .keys { margin-top: 14px; border-top: 1.5px solid var(--fg-soft); padding-top: 10px; color: var(--fg-soft); }
  .keys div { display: flex; justify-content: space-between; padding: 2px 0; }
  /* section circles: right lane of the config panel, title-dot size, tangent stacking */
  #secc { position: fixed; top: 0; right: 8px; z-index: 11; display: flex; flex-direction: column; align-items: center; transform: translateX(150%); transition: transform .2s ease-out; }
  #tab:hover ~ #secc, #panel:hover ~ #secc, #panel.open ~ #secc { transform: translateX(0); }
  #secc .sci { display: flex; flex-direction: column; align-items: center; }
  #secc .sc { border-radius: 50%; box-sizing: border-box; cursor: pointer; flex: none; }
  #secc .sl { text-transform: uppercase; font-size: 13px; overflow: hidden; height: 0; transition: height .25s ease; pointer-events: none; margin-top: 10px; text-align: center; }
  #secc .sl span { display: block; opacity: 0; transition: opacity .06s linear; line-height: 17px; }
  /* admin entry: 4 hollow circles stacked at the bottom right, on the section-circle axis */
  #adm { display: none; position: fixed; right: 8px; bottom: 14px; z-index: 11; flex-direction: column; align-items: center; cursor: text; opacity: 0; pointer-events: none; transition: opacity .2s ease-out; }
  #adm.on { display: flex; }
  /* the admin entry lives and dies with the config area */
  #tab:hover ~ #adm.on, #panel:hover ~ #adm.on, #panel.open ~ #adm.on { opacity: 1; pointer-events: auto; }
  #adm .ac { border-radius: 50%; box-sizing: border-box; display: flex; align-items: center; justify-content: center; color: var(--fg); font-family: 'Fragment Mono', ui-monospace, monospace; }
  #adm .ac span { line-height: 1; }
  #adm.err .ac { border-color: #ff3c3c !important; color: #ff3c3c; }
  #cur { position: fixed; left: 0; top: 0; display: none; pointer-events: none; z-index: 8; box-sizing: border-box; border: 1px solid #000; border-radius: 50%; will-change: transform; }
  #cur i { position: absolute; left: 50%; top: 50%; width: 2px; height: 2px; border-radius: 50%; transform: translate(-50%, -50%); background: #000; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="g"></canvas>
<div id="cur"><i></i></div>
<div id="tab"></div>
<div id="panel">
  <h1>CONFIG</h1>
  <div class="stats" id="stats"></div>
  <div id="controls"></div>
  <div class="btns" id="btns"></div>
  <div class="keys">
    <div><span>click</span><span>random action</span></div>
    <div><span>a + click</span><span>add cell</span></div>
    <div><span>d + click</span><span>kill cells</span></div>
    <div><span>s + click</span><span>respawn</span></div>
    <div><span>b + click</span><span>background</span></div>
    <div><span>c</span><span>this panel</span></div>
  </div>
</div>
<div id="blur"><div class="bf bf1"></div><div class="bf bf2"></div><div class="bf bf3"></div><div class="bf bf4"></div></div>
<div id="blurl"><div class="bf bf1"></div><div class="bf bf2"></div><div class="bf bf3"></div><div class="bf bf4"></div></div>
<script src="grain.js"></script>
<script src="audio.js"></script>
<script src="ca2.js"></script>
</body>
</html>
