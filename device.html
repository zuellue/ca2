<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ca2 · mobile</title>
<style>
  /* phone-frame preview of the mobile mode: the site at an exact phone viewport, centered, pitch black outside (owner 21 Oct) */
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { font-family: 'Fragment Mono', ui-monospace, 'SF Mono', Menlo, monospace; }
  #stage { position: fixed; left: 50%; top: 50%; transform-origin: 0 0; }
  #stage iframe { border: 0; display: block; background: #fff; }
  #devs { position: fixed; left: 22px; top: 50%; transform: translateY(-50%); color: #e9e9e9; font-size: 12px; letter-spacing: .04em; line-height: 1.3; z-index: 2; }
  #devs .t { color: rgba(233,233,233,.35); text-transform: uppercase; letter-spacing: calc(.3em + 1px); padding-bottom: 3px; margin-bottom: 8px; border-bottom: 1px solid #333; width: fit-content; }
  #devs a { display: block; color: inherit; text-decoration: none; padding: 6px 0; cursor: pointer; }
  #devs a small { color: rgba(233,233,233,.35); }
  #devs a.on { color: #fff; }
  #devs a.on::after { content: ' \2022'; }
  #meta { position: fixed; right: 22px; top: 16px; color: rgba(233,233,233,.35); font-size: 11px; letter-spacing: .04em; text-align: right; line-height: 1.5; z-index: 2; }
  /* orientation circles (owner 23 Oct): top-left of the black control screen, never inside the preview; P stands the phone up, L lays it on its side so the page inside really re-lays out at the landscape viewport */
  #orient { display: none; position: fixed; left: 22px; top: 16px; z-index: 3; gap: 8px; }
  #orient.show { display: flex; }
  .oc { position: relative; height: 28px; min-width: 28px; width: 28px; box-sizing: border-box; border-radius: 999px; border: 1.5px solid #e9e9e9; background: transparent; color: #e9e9e9; padding: 0; font: inherit; font-size: 12px; cursor: pointer; overflow: hidden; white-space: nowrap; transition: width .18s ease; }
  .oc.on { border-width: 2.5px; border-color: #fff; color: #fff; }
  .oc.x { padding: 0 10px; }
  .oc i { font-style: normal; } .oc s { display: none; text-decoration: none; font-weight: 600; }
  .oc.x i { display: none; } .oc.x s { display: inline; }
  #scale { position: fixed; left: 22px; bottom: 16px; z-index: 2; }
  #savem { display: none; position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 2; }
  #scale a, #savem a { color: #e9e9e9; text-decoration: none; font-size: 13px; letter-spacing: calc(.3em + 1px); text-transform: uppercase; cursor: pointer; }
  #scale a:hover, #savem a:hover { color: #fff; }
  /* the desktop page's code entry, moved here verbatim (owner 21 Oct): 4 hollow stacked circles bottom-right,
     the code fills them top to bottom, an accepted code turns them into A B D U and B / D become buttons */
  #adm2 { position: fixed; right: 22px; bottom: 16px; z-index: 2; display: flex; flex-direction: column; align-items: center; cursor: text; }
  #adm2 .ac { width: 34px; height: 34px; border: 1px solid #e9e9e9; border-radius: 50%; box-sizing: border-box; display: flex; align-items: center; justify-content: center; color: #e9e9e9; font-size: 13px; }
  #adm2 .ac span { line-height: 1; }
  #adm2.err .ac { border-color: #ff3c3c !important; color: #ff3c3c; }
  #adm2.ok .ac.mb { cursor: pointer; }
  #adm2.ok .ac.mb:hover { border-color: #fff; color: #fff; }
</style>
</head>
<body>
<div id="devs"><div class="t">device</div></div>
<div id="stage"><iframe id="fr" title="ca2 mobile"></iframe></div>
<div id="meta"></div>
<div id="orient"><button type="button" class="oc" id="ocP" aria-label="PORTRAIT"><i>P</i><s>PORTRAIT</s></button><button type="button" class="oc" id="ocL" aria-label="LANDSCAPE"><i>L</i><s>LANDSCAPE</s></button></div>
<div id="adm2"><div class="ac"><span></span></div><div class="ac"><span></span></div><div class="ac"><span></span></div><div class="ac"><span></span></div></div>
<div id="scale"><a id="scalea">scale: fit</a></div>
<div id="savem"><a id="savea">save</a></div>
<script>
(function () {
  // name, css width, css height, device pixel ratio - real values, verified 21 Oct (webmobilefirst / screensize.io / yesviz / store.google.com)
  // near-duplicates dropped (owner 21 Oct): two viewports within 20 css px in width and 30 in height count as one, the
  // representative stays. Dropped: iphone 16 pro (402x874, 9px/22px from iphone 15/16) and iphone 15 pro max (430x932,
  // 10px/24px from iphone 16 pro max). Foldables opened (near-square, owner 21 Oct): fold 8 816x616@3 (2448x1848 panel),
  // pixel 11 pro fold 791x820@2.625 (2076x2152 panel), iphone duo 890x626@3 (2670x1878 panel).
  var DEVS = [
    ['galaxy s24', 360, 780, 3],
    ['iphone se', 375, 667, 2],
    ['iphone 13 mini', 375, 812, 3],
    ['iphone 15 / 16', 393, 852, 3],
    ['pixel 8', 412, 915, 2.625],
    ['iphone 16 pro max', 440, 956, 3],
    ['pixel 11 pro fold', 791, 820, 2.625],
    ['galaxy z fold 8', 816, 616, 3],
    ['iphone duo', 890, 626, 3]
  ];
  // scale modes: 'fit' fills the window (may exceed 100% - the old cap at 100% was the 'too small' complaint), then fixed sizes
  var SCALES = ['fit', '100%', '125%', '150%', '200%'];
  var devs = document.getElementById('devs'), stage = document.getElementById('stage'), fr = document.getElementById('fr'), meta = document.getElementById('meta'), scalea = document.getElementById('scalea');
  var cur = 1; try { cur = Math.min(DEVS.length - 1, Math.max(0, parseInt(localStorage.getItem('ca2.device') || '1', 10) || 0)); } catch (e) {}
  var scaleMode = 0; try { scaleMode = Math.max(0, Math.min(SCALES.length - 1, SCALES.indexOf(localStorage.getItem('ca2.scale') || 'fit'))); } catch (e) {}
  var links = [];
  var ocP = document.getElementById('ocP'), ocL = document.getElementById('ocL'), orientEl = document.getElementById('orient');
  function rgb() { return 'rgb(' + Math.floor(Math.random() * 256) + ',' + Math.floor(Math.random() * 256) + ',' + Math.floor(Math.random() * 256) + ')'; }
  [ocP, ocL].forEach(function (b) { // the login-circle hover language: random colour, grows into the full word
    b.addEventListener('pointerenter', function () { b.classList.add('x'); b.style.width = (b.querySelector('s').getBoundingClientRect().width + 24) + 'px'; var c = rgb(); b.style.background = c; b.style.borderColor = c; b.style.color = '#000'; });
    b.addEventListener('pointerleave', function () { b.classList.remove('x'); b.style.width = ''; b.style.background = ''; b.style.borderColor = ''; b.style.color = ''; });
  });
  function setOrient(o) {
    if (o === orient) return;
    orient = o; try { localStorage.setItem('ca2.orient', o); } catch (e) {}
    fit(); // the frame resizes to the rotated viewport; the page inside re-lays out on its own resize
    try { var w = fr.contentWindow; if (w && typeof w.__ca2ProfFollow === 'function') setTimeout(w.__ca2ProfFollow, 60); } catch (e) {}
  }
  ocP.addEventListener('click', function () { setOrient('P'); });
  ocL.addEventListener('click', function () { setOrient('L'); });
  DEVS.forEach(function (d, i) {
    var a = document.createElement('a');
    a.innerHTML = d[0] + ' <small>' + d[1] + '\u00d7' + d[2] + '</small>';
    a.addEventListener('click', function () { pick(i, true); });
    devs.appendChild(a); links.push(a);
  });
  var orient = 'P'; try { orient = localStorage.getItem('ca2.orient') === 'L' ? 'L' : 'P'; } catch (e) {}
  function fit() {
    var d0 = DEVS[cur];
    var d = orient === 'L' ? [d0[0], d0[2], d0[1], d0[3]] : d0; // landscape = the same phone on its side: width and height swap
    var fitS = Math.min((window.innerWidth - 500) / d[1], (window.innerHeight - 48) / d[2]);
    var s, fixed = scaleMode > 0;
    if (fixed) s = parseFloat(SCALES[scaleMode]) / 100;
    else s = Math.min(3, Math.max(0.2, fitS)); // fit now fills the window instead of capping at 100%
    fr.width = d[1]; fr.height = d[2];
    if (fixed && s > fitS) {
      // bigger than the window: pin top-center and let the page scroll the phone
      document.body.style.height = 'auto';
      document.body.style.minHeight = (Math.round(d[2] * s) + 64) + 'px';
      document.body.style.overflowY = 'auto';
      stage.style.position = 'absolute';
      stage.style.left = '50%'; stage.style.top = '24px';
      stage.style.transformOrigin = 'top center';
      stage.style.transform = 'translateX(-50%) scale(' + s + ')';
    } else {
      document.body.style.height = '100%';
      document.body.style.minHeight = '0';
      document.body.style.overflowY = 'hidden';
      stage.style.position = 'fixed';
      stage.style.left = '50%'; stage.style.top = '50%';
      stage.style.transformOrigin = '0 0';
      // keep the frame's top-left at the visual centre: transform-origin 0 0 with an explicit offset
      stage.style.transform = 'translate(' + (-d[1] * s / 2) + 'px,' + (-d[2] * s / 2) + 'px) scale(' + s + ')';
    }
    meta.innerHTML = d[0] + '<br>' + d[1] + ' \u00d7 ' + d[2] + ' @ ' + d[3] + 'x<br>' + (orient === 'L' ? 'landscape' : 'portrait') + '<br>' + Math.round(s * 100) + '%';
    ocP.classList.toggle('on', orient === 'P'); ocL.classList.toggle('on', orient === 'L');
    scalea.textContent = 'scale: ' + SCALES[scaleMode];
  }
  function pick(i, nav) {
    cur = i; try { localStorage.setItem('ca2.device', String(i)); } catch (e) {}
    links.forEach(function (a, j) { a.classList.toggle('on', j === i); });
    var d = DEVS[i];
    if (nav || !fr.src) fr.src = 'index.html?mobile=1&dpr=' + d[3];
    fit();
  }
  scalea.addEventListener('click', function () {
    scaleMode = (scaleMode + 1) % SCALES.length;
    try { localStorage.setItem('ca2.scale', SCALES[scaleMode]); } catch (e) {}
    fit();
  });
  // ---- code entry + B/D, the desktop page's admin widget moved here verbatim (owner 21 Oct) ----
  // The code entered here unlocks the preview inside the frame too (same origin): the mobile page never asks again.
  var WK = 'https://ca2-presets.middots.workers.dev/';
  var adm2 = document.getElementById('adm2');
  var acs = [].slice.call(adm2.querySelectorAll('.ac'));
  var glyphs = acs.map(function (a) { return a.firstChild; });
  var adminCode = null, outerOn = false;
  // the real input is invisible and only catches keys, same as the desktop widget
  var cbox = document.createElement('input');
  cbox.type = 'text'; cbox.maxLength = 4; cbox.setAttribute('inputmode', 'numeric'); cbox.autocomplete = 'off'; cbox.spellcheck = false;
  cbox.style.cssText = 'position:fixed;left:-200px;top:0;width:20px;height:20px;opacity:0;border:0;padding:0;outline:none';
  document.body.appendChild(cbox);
  function wpost(b) { return fetch(WK, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) }).then(function (r) { return r.json(); }); }
  function unlockInner(code) { // hand the accepted code to the page inside the frame through its ca2code gate
    try {
      var w = fr.contentWindow;
      if (!w || w.__adminOn) return true;
      w.dispatchEvent(new w.CustomEvent('ca2code', { detail: { code: code } }));
    } catch (e) {}
    return false;
  }
  var pushIv = null;
  function pushCode() { // retry until the frame takes it - it may still be booting when the code is accepted
    if (!adminCode || pushIv) return;
    var n = 0;
    pushIv = setInterval(function () {
      if (++n > 40 || unlockInner(adminCode)) { clearInterval(pushIv); pushIv = null; }
    }, 250);
  }
  function setOk() {
    outerOn = true;
    document.getElementById('savem').style.display = 'block';
    var ABDU = String.fromCharCode(65, 66, 68, 85); for (var i = 0; i < 4; i++) glyphs[i].textContent = ABDU[i]; // no admin string ships in the public file (owner 21 Oct); the letters materialize only after the server accepts the code. End state: this whole widget is served by the Worker's admin module
    adm2.classList.add('ok');
  }
  adm2.addEventListener('click', function () { cbox.focus(); });
  cbox.addEventListener('input', function () {
    cbox.value = cbox.value.replace(/\D/g, '').slice(0, 4);
    for (var i = 0; i < 4; i++) glyphs[i].textContent = cbox.value[i] || '';
    if (cbox.value.length === 4) {
      var code = cbox.value;
      wpost({ code: code, check: true }).then(function (r) {
        if (r && r.ok) { adminCode = code; setOk(); pushCode(); }
        else { adm2.classList.add('err'); setTimeout(function () { adm2.classList.remove('err'); glyphs.forEach(function (g) { g.textContent = ''; }); }, 600); }
        cbox.value = ''; cbox.blur();
      }).catch(function () { cbox.value = ''; cbox.blur(); });
    }
  });
  // B and D are buttons once the accepted code turns the glyphs into A B D U: B stays on the mobile preview, D goes to the desktop page
  acs[1].classList.add('mb'); acs[2].classList.add('mb');
  acs[1].addEventListener('click', function (e) { if (!outerOn) return; e.stopPropagation(); }); // B: already the mobile preview
  acs[2].addEventListener('click', function (e) { // D: the desktop page (replaces the old desktop link)
    if (!outerOn) return;
    e.stopPropagation();
    try { localStorage.setItem('ca2.mode', 'desktop'); } catch (e2) {}
    location.href = 'index.html';
  });
  // a fresh frame inherits the unlocked state; an unlock done inside the frame mirrors back out here
  fr.addEventListener('load', function () { try { setTimeout(function () { var w = fr.contentWindow; if (w && w.__ca2ProfFollow) w.__ca2ProfFollow(); }, 1500); } catch (e) {} pushIv && clearInterval(pushIv); pushIv = null; pushCode(); }); // a fresh frame inherits the unlocked state
  setInterval(function () {
    try { if (!outerOn && fr.contentWindow && fr.contentWindow.__adminOn) setOk(); } catch (e) {}
    try { var on = !!(fr.contentWindow && fr.contentWindow.__adminOn) || outerOn; orientEl.classList.toggle('show', on); } catch (e) {}
    // owner 23 Oct: once the frame's verified Worker module offers the host bridge, the host page runs the SAME
    // admin widget bottom-right (no hand-built duplicate, nothing inside the preview). The bridge moves the widget
    // DOM + listeners onto this document; the frame's own widget stays hidden. On logout the hand-built entry
    // circles return for the next login.
    try {
      var w = fr.contentWindow;
      // DESK follow first (the bridge-mount call below can throw once the frame starts reloading and must not starve this): the host-mounted widget's DESK action flips the frame's mode: follow it to the desktop page (owner 23 Oct)
      if (w && ((typeof w.__ca2Mode === 'function' && w.__ca2Mode() === 'd') || localStorage.getItem('ca2.mode') === 'd')) { try { localStorage.setItem('ca2.mode', 'desktop'); } catch (e2) {} location.href = 'index.html'; }
      if (w && w.__adminOn && typeof w.__ca2MountAdminHost === 'function' && !hostMounted) {
        if (w.__ca2MountAdminHost(document)) { hostMounted = true; adm2.style.display = 'none'; document.getElementById('savem').style.display = 'none'; }
      }
      if (hostMounted && w && !w.__adminOn) { hostMounted = false; adm2.style.display = ''; }
    } catch (e) {}
  }, 400);
  var hostMounted = false;
  // page-level save: bottom row, centered under the preview, same line as the desktop link (owner 21 Oct).
  // Drives the real save button inside the frame (its handler and text states stay authoritative) and mirrors its label.
  var savea = document.getElementById('savea');
  function innerSave() {
    try {
      var d = fr.contentDocument; if (!d) return null;
      var bs = [].slice.call(d.querySelectorAll('button'));
      return bs.filter(function (x) { return x.dataset && x.dataset.ca2save === '1'; })[0] || bs.filter(function (x) { return x.textContent === 'save'; })[0] || null;
    } catch (e) { return null; }
  }
  savea.addEventListener('click', function () { var b = innerSave(); if (b) b.click(); });
  setInterval(function () { var b = innerSave(); if (b && savea.textContent !== b.textContent) savea.textContent = b.textContent; }, 400);
  window.addEventListener('resize', fit);
  pick(cur, true);
})();
</script>
</body>
</html>
